[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --alluredir=allure-results
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
markers =
    ui: Playwright browser tests
    api: REST API tests (requests)
    security: authentication / authorization / input-validation tests
    smoke: fast critical-path subset
    regression: full regression suite
    schema: JSON schema contract validation
